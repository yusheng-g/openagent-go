+ execution 合并在 tool.execute 内。\"},\"governance\":{\"title\":\"分层治理\",\"desc\":\"rules → safety → approval memory → human。首匹配规则、只读自动放行、多 key 全命中记忆、fail-closed 人工层。Plan 模式移除执行工具，安全探索。\"},\"plugins\":{\"title\":\"WASM 插件 + 沙箱\",\"desc\":\"6 种插件类型 + cron 定时任务，28 个 host 导出，wazero 运行时，Rust PDK。OS 原生沙箱（Linux bwrap / macOS Seatbelt）约束 shell、文件、网络。\"}},\"archTeaserTitle\":\"架构一览\",\"archTeaserDesc\":\"Agent 是纯配置；kernel.Runtime 是跑 7-stage 循环的薄编排层。真正的子系统——context、execution、governance、session、provider、eventbus——是独立顶层包，以接口注入，而非 kernel 的子目录。\",\"archReadMore\":\"阅读完整架构 →\",\"arch\":{\"app\":{\"title\":\"Application\",\"sub\":\"rest · acp · cmd/cli\",\"note\":\"组装 Agent 配置 + Deps\"},\"new\":\"New(*agent.Agent, Deps)\",\"runtime\":{\"title\":\"kernel.Runtime\",\"sub\":\"7-stage 主循环\",\"note\":\"薄编排层\"},\"loopLabel\":\"主循环（observer.go 阶段）\",\"stages\":[\"guard.in\",\"memory.fetch\",\"prompt.build\",\"model.call\",\"guard.out\",\"tool.execute\",\"memory.append\"],\"deps\":\"Deps 依赖注入——独立顶层包\",\"pkg\":{\"context\":\"context/ — AgentContext + 知识\",\"execution\":\"execution/ — 工具任务、重试、流\",\"governance\":\"governance/ — rules→safety→memory→human\",\"session\":\"session/ — 存储 + 压缩\",\"provider\":\"provider/ — skill | resource\",\"eventbus\":\"eventbus/ — 审计事件\"},\"pluggable\":\"全部接口注入\",\"iface\":{\"title\":\"Model · Tools · MCP\",\"sub\":\"可插拔\",\"note\":\"按 Agent 配置替换\"},\"transport\":\"ACP · REST · CLI · IM 渠道\",\"out\":{\"title\":\"传输层\",\"sub\":\"stdio · HTTP · WebSocket\",\"note\":\"ACP v1 / REST+SSE / 飞书 / 微信 / 企微\"},\"deliver\":\"执行 · 守卫 · 审批 → 流式 + 持久化\"},\"quickstartTitle\":\"快速开始\",\"prereq\":\"前置条件：Go 1.26+。\",\"buildTitle\":\"构建与运行\",\"configTitle\":\"配置\",\"firstRunTitle\":\"首次运行\",\"firstRun\":[\"构建 CLI：go build -o openagent ./cmd/cli/\",\"创建 ~/.openagent/settings.json，配置 provider（api_key + models）。\",\"可选：在 ~/.openagent/profile/ 放 AGENTS.md（工作规则）和 SOUL.md（人设）。\",\"运行 ./openagent serve --acp（ACP 客户端，VSCode/Zed）或 --port 8080（REST + SSE）。\",\"开关能力：--guard on、--approver on、--sandbox（OS 级沙箱）。\",\"把 .wasm 文件放进 ~/.openagent/plugins/——按类型自动加载。\"]},\"docs\":{\"sidebarTitle\":\"openagent-go\",\"sidebarVersion\":\"文档\",\"groupOverview\":\"概览\",\"groupReference\":\"参考\",\"architecture\":\"架构\",\"concepts\":\"核心概念\",\"plugins\":\"插件\",\"changelog\":\"更新日志\",\"arch\":{\"title\":\"架构\",\"intro\":\"Agent 是纯配置；kernel.Runtime 是跑 7-stage 主循环的薄编排层。真正的子系统是经 Deps 串联的独立顶层包——不是 kernel 的内部模块。\",\"layersTitle\":\"分层\",\"layers\":[{\"title\":\"Agent 是纯配置\",\"desc\":\"agent.Agent 只含字段：SystemPrompts、Model、Prompt、InGuard、OutGuard、MaxTurns、MaxWorkingTokens、MaxCompressedTokens、SubAgents。无执行方法。New(*agent.Agent, Deps) 分离配置与运行时。\",\"chips\":[\"纯配置\",\"DI\",\"无执行\"],\"example\":\"// agent/agent.go\\ntype Agent struct {\\n    SystemPrompts []string\\n    Model    openagent.Model      // 接口\\n    Prompt   openagent.PromptBuilder\\n    InGuard  governance.InputGuard\\n    OutGuard governance.OutputGuard\\n    SubAgents []SubAgent\\n    // ...MaxTurns, token 预算\\n}\"},{\"title\":\"7-stage 主循环\",\"desc\":\"observer.go 声明 7 个 stage 常量。run() 按此顺序发出 observe 事件；policy + execution 合并在 executeTools 内（无独立 stage）。memory.append 在每条提交的消息后触发。\",\"chips\":[\"observe\",\"每条提交\",\"7-stages\"],\"example\":\"// observer.go\\nStageGuardIn  = \\\"guard.in\\\"\\nStageMemoryFetch = \\\"memory.fetch\\\"\\nStagePromptBuild = \\\"prompt.build\\\"\\nStageModelCall   = \\\"model.call\\\"\\nStageGuardOut    = \\\"guard.out\\\"\\nStageToolExecute = \\\"tool.execute\\\"\\nStageMemoryAppend = \\\"memory.append\\\"\"},{\"title\":\"Deps 注入的顶层包\",\"desc\":\"context、execution、governance、session、provider、eventbus 是独立包，不是 kernel 的子目录。Runtime 通过 Deps 以接口字段持有它们。kernel 是薄编排者，不是实现。\",\"chips\":[\"接口驱动\",\"可插拔\",\"薄编排\"],\"example\":\"// kernel/runtime.go\\ntype Runtime struct {\\n    cfg  *agent.Agent\\n    deps Deps\\n    execution execution.Runtime   // 注入\\n    context   ctxpkg.Runtime      // 注入\\n    // SessionStore, Policy, HumanApprover, ...\\n}\"},{\"title\":\"治理策略链\",\"desc\":\"Engine.Evaluate 是一个内联方法：rules（首匹配 glob）→ safety（只读工具自动放行）→ memory（多 key 全命中）→ human（fail-closed）。Shell 命令分解为原子 + 文件访问；全部命中才跳过审批。\",\"chips\":[\"分层\",\"fail-closed\",\"多key全命中\"],\"example\":\"// governance/policy.go Evaluate()\\n1. rules    — 首匹配 Rule 生效（Allow/Deny/Ask）\\n2. safety   — 只读工具（read/ls/grep/...）→ Allow\\n3. memory   — Recall；多 key 工具需全命中\\n4. human    — nil approver → Deny（fail closed）\"},{\"title\":\"两层记忆 + 知识层\",\"desc\":\"Working：token 驱动裁剪（窗口 70% 或 MaxWorkingTokens）。Compressed：LLM 增量摘要（8 段格式），溢出自动触发或 /compact 手动。SessionStore 消息永不删除。独立的 MemoryProvider 持久化知识（preference/fact/lesson），向量 + 关键词召回——self-evolution，不是消息归档。\",\"chips\":[\"token驱动\",\"LLM摘要\",\"永不删除\",\"向量召回\"],\"example\":\"// kernel/prepare.go — working 裁剪\\nbudget := workingTokenBudget()  // 窗口 70%\\noverflow := scanTokensBottomUp(msgs)\\nreturn msgs[overflow:], ci, nil\\n\\n// ContextUsage() → (summary, working, window)  // 两层\"},{\"title\":\"ToolResult 落盘\",\"desc\":\"DefaultResultPolicy：当工具结果的 token 数超过模型上下文窗口的 5%，内容写入 /tmp/openagent/sess-\u003cid\u003e/artifact-\u003chex\u003e.txt（长行 32K rune 换行）。上下文内结果替换为指针；置 FileRef + Truncated 标志。\",\"chips\":[\"5%阈值\",\"落盘\",\"FileRef\"],\"example\":\"// result.go DefaultResultPolicy.Apply()\\nthreshold := cw * 5 / 100\\nif CountTokens(modelID, content) \u003e threshold {\\n    path := filepath.Join(ArtifactRoot(), \\\"sess-\\\"+id,\\n        \\\"artifact-\\\"+randHex(8)+\\\".txt\\\")\\n    // 写入换行内容，置 Truncated + FileRef\\n}\"}],\"stackTitle\":\"技术栈\",\"stack\":[{\"layer\":\"语言\",\"stack\":\"Go 1.26\"},{\"layer\":\"运行时\",\"stack\":\"kernel.Runtime — 7-stage 主循环，Deps DI\"},{\"layer\":\"协议\",\"stack\":\"ACP v1 (JSON-RPC 2.0), MCP\"},{\"layer\":\"插件\",\"stack\":\"wazero WASM, Rust PDK (openagent-pdk)\"},{\"layer\":\"存储\",\"stack\":\"SQLite + FTS5, 文件存储\"},{\"layer\":\"沙箱\",\"stack\":\"Linux bwrap, macOS Seatbelt\"},{\"layer\":\"分词器\",\"stack\":\"tiktoken（模型感知，大文本采样估算）\"},{\"layer\":\"嵌入\",\"stack\":\"BGE（离线 ONNX Runtime），OpenAI 兼容 API\"}]},\"concept\":{\"title\":\"核心概念\",\"intro\":\"openagent-go 的词汇表——Agent 是纯配置；运行时是执行体；一切可插拔的皆为接口。\",\"groups\":[{\"group\":\"配置\",\"items\":[{\"name\":\"Agent\",\"desc\":\"纯配置：系统提示词、模型、守卫、子智能体、token 预算。无执行方法。通过 New(*agent.Agent, Deps) 组装进 Runtime。\",\"chips\":[\"纯配置\",\"无执行\"],\"example\":\"agent := agent.New(\\n    agent.WithModel(model),\\n    agent.WithSystemPrompts(\\\"你是...\\\"),\\n    agent.WithSubAgents(...),\\n)\\nrt := kernel.New(agent, deps)\"},{\"name\":\"SubAgent\",\"desc\":\"注册为普通工具（以 agent 名命名，如 \\\"researcher\\\"）的子智能体。父智能体通过工具调用委派子任务；子智能体跑完整 agent 循环，隔离记忆（无 SessionStore）、过滤工具、继承守卫，返回 FinalOutput。同步——父阻塞等子完成。不是 transfer_to_*。\",\"chips\":[\"as-tool\",\"同步\",\"隔离记忆\"],\"example\":\"// kernel/as_tool.go\\n// sa.Name → 工具名（如 \\\"researcher\\\"）\\n// 父调用 researcher(task) → 阻塞\\n// 子：自己的 prompt，无 SessionStore\\n// 返回 FinalOutput 字符串\"},{\"name\":\"AGENTS.md / SOUL.md\",\"desc\":\"静态 context profile。AGENTS.md = 工作规则；SOUL.md = 人设与限制。用户级（~/.openagent/profile/）+ 项目级（$(pwd)/）解析；项目覆盖用户。\",\"chips\":[\"静态\",\"profile\",\"覆盖\"],\"example\":\"~/.openagent/profile/AGENTS.md   # 用户规则\\n./AGENTS.md                      # 项目规则（优先）\"}]},{\"group\":\"多智能体\",\"items\":[{\"name\":\"SubAgent（as-tool）\",\"desc\":\"单智能体委派：父 agent 把子 agent 注册为普通工具，调用它处理子任务。子 agent 跑完整 agent 循环，隔离记忆（无 SessionStore）、过滤工具、继承守卫，返回输出。同步——父阻塞等子完成。工具名是 agent 名，不是 transfer_to_*。\",\"chips\":[\"委派\",\"同步\",\"隔离\"],\"example\":\"// kernel/as_tool.go + subagent.go\\n// 父调用 researcher(task) → 阻塞\\n// 子：自己的 prompt，无 SessionStore\\n// 返回 FinalOutput → 工具结果\"},{\"name\":\"Team（transfer_to_*）\",\"desc\":\"控制权交接：agent 顺序链式运行，一次一个。当 agent 调用 transfer_to_X（EndTurn 工具），控制权转给 agent X——原 agent 的轮次结束。每 agent 有私有记忆（工具调用/结果）+ 共享团队记忆。环检测：ping-pong（A-B-A-B）和频率（≥3 次）。transfer_to_* 是 Team 专属——不是 SubAgent，不是 Orchestrate。\",\"chips\":[\"交接\",\"EndTurn\",\"私有+共享记忆\",\"环检测\"],\"example\":\"// agent/team.go\\n// handoffTool: transfer_to_\u003cname\u003e, EndTurn=true\\n// teamRunner: 顺序链, maxHandoffs=10\\n// REST: POST /api/team/... (rest/team.go)\"},{\"name\":\"Orchestrate（DAG）\",\"desc\":\"规划再执行：LLM Planner 在执行前一次性把目标分解成 DAG。Executor 用拓扑序 + 并行批（errgroup，最多 8）运行步骤。运行时是确定性的——除失败时 auto-replan（重建受影响子树）和步骤摘要外无 LLM。每步骤独立会话；上游结果以摘要共享。\",\"chips\":[\"DAG\",\"并行\",\"auto-replan\",\"确定性运行时\"],\"example\":\"// orchestrate/orchestrate.go + executor.go\\n// Planner.Plan() → PlanDef (DAG)\\n// executor: Kahn 拓扑排序 + errgroup 批\\n// REST: /generate(SSE) /execute /replan\"}]},{\"group\":\"运行时\",\"items\":[{\"name\":\"Runtime\",\"desc\":\"执行体。跑 7-stage 循环，持有 Deps 注入的子系统，按会话管理工具/审批器/记忆。由 kernel.New(agent, deps) 创建。\",\"chips\":[\"7-stage\",\"编排者\",\"Deps\"],\"example\":\"// kernel/runtime.go\\nrt := kernel.New(agent, deps)\\nrt.RunStream(ctx, session, ...)\"},{\"name\":\"AgentContext\",\"desc\":\"每个 turn 0 由 context.Runtime.Build() 装配：系统提示词 + 召回知识 + working 记忆 + 压缩摘要。后续 turn 用新消息更新。\",\"chips\":[\"每turn\",\"知识召回\"],\"example\":\"// context/provider.go\\nac := rt.context.Build(session)\\n// system + skills + memory + working + summary\"},{\"name\":\"Session\",\"desc\":\"三种模式：auto（工具立即执行）、manual（每个非只读工具需审批）、plan（执行前 plan_create/plan_update）。会话状态在 SessionStore。\",\"chips\":[\"auto\",\"manual\",\"plan\"],\"example\":\"./openagent serve --acp\\n# 模式经 /mode 或 session/set_mode 设置\\n# settings.json 的 default_mode\"}]},{\"group\":\"治理\",\"items\":[{\"name\":\"Policy\",\"desc\":\"分层引擎：rules → safety → memory → human。rules = 首匹配 glob；safety = 只读自动放行；memory = 多 key 全命中；human = fail-closed。\",\"chips\":[\"分层\",\"Evaluate\"],\"example\":\"// governance/policy.go\\nd, err := engine.Evaluate(ctx, call, def, session)\\n// Allow | Deny | Ask(→human)\"},{\"name\":\"ApprovalMemory\",\"desc\":\"两个实现：SessionApprovalMemory（进程内）和 PersistentApprovalMemory（存储后端，跨重启）。Remember/Recall 按工具 + 参数为 key；shell 用多 key（原子 + 文件）。\",\"chips\":[\"session\",\"persistent\",\"多key\"],\"example\":\"// governance/memory.go + persistent_memory.go\\ntype ApprovalMemory interface {\\n    Remember(ctx, sessionID, key, Decision) error\\n    Recall(ctx, sessionID, key) (Decision, bool)\\n}\"},{\"name\":\"Decision\",\"desc\":\"策略裁决：Allow、Deny（带原因）、或 Ask（路由到人工）。携带 ModifiedArgs，使人工可以编辑参数后批准。\",\"chips\":[\"Allow\",\"Deny\",\"Ask\",\"ModifiedArgs\"],\"example\":\"type Decision struct {\\n    Action       ApprovalAction  // allow|deny|ask\\n    Reason       string\\n    ModifiedArgs json.RawMessage\\n}\"}]},{\"group\":\"记忆与知识\",\"items\":[{\"name\":\"Working memory\",\"desc\":\"最近消息窗口，按 token 数裁剪。预算 = MaxWorkingTokens 或模型上下文窗口的 70%。溢出从底部裁。\",\"chips\":[\"token驱动\",\"70%窗口\"],\"example\":\"// kernel/prepare.go\\nbudget := workingTokenBudget()\\nreturn msgs[overflow:], ci, nil\"},{\"name\":\"Compressed memory\",\"desc\":\"LLM 生成的增量摘要，8 段格式（Claude Code 格式）。working 溢出时自动触发，或 /compact 手动。受 MaxCompressedTokens 约束。\",\"chips\":[\"LLM摘要\",\"8段\",\"/compact\"],\"example\":\"// summarizer/llm.go\\nsummary, err := compressor.Summarize(ctx, msgs)\\n// 作为压缩段注入 prompt\"},{\"name\":\"MemoryProvider\",\"desc\":\"独立的持久知识层——不是消息归档。存储 preference/fact/lesson 条目，向量 + 关键词召回。LLM 抽取器把完成的 run 转为知识（self-evolution）。可插拔：SQLite（向量）或 OpenViking（远程）。\",\"chips\":[\"preference\",\"fact\",\"lesson\",\"向量\",\"self-evolution\"],\"example\":\"// context/provider.go\\ntype MemoryProvider interface {\\n    Search(ctx, query) ([]Knowledge, error)\\n    Remember(ctx, Knowledge) error\\n}\\n// kinds: preference | fact | lesson\"}]},{\"group\":\"扩展\",\"items\":[{\"name\":\"WASM Plugin\",\"desc\":\"6 种类型：agent:tools、agent:observers（agent 侧）；cli:settings、cli:commands、cli:observers、cli:http（CLI 侧）。任一可声明 cron 定时任务。wazero 运行时，Rust PDK，28 个 host 导出。\",\"chips\":[\"wasm\",\"6类型\",\"cron\",\"wazero\"],\"example\":\"// settings.json\\n{ \\\"plugins\\\": [\\\"~/.openagent/plugins\\\"] }\\n// 扫描 *.wasm，按 metadata 类型加载\"},{\"name\":\"MCP\",\"desc\":\"Model Context Protocol 客户端——把外部工具（浏览器、IaC 等）导入智能体的工具集。每次工具调用渲染为普通工具结果。\",\"chips\":[\"外部工具\",\"stdio/http\"],\"example\":\"// settings.json\\n\\\"mcp_servers\\\": {\\n  \\\"browser\\\": { \\\"command\\\": \\\"npx\\\",\\n    \\\"args\\\": [\\\"-y\\\",\\\"@anthropic/mcp-server-browser-tools\\\"] }\\n}\"},{\"name\":\"Hook / Observer\",\"desc\":\"RunHooks：start/end 回调共享不透明状态（OTEL span 嵌套，slog 记录时长）。Observer：7 个阶段每个的 enter/leave——可中止 run。\",\"chips\":[\"RunHooks\",\"Observer\",\"7-stages\"],\"example\":\"// observer.go\\nrt.observe(ctx, StageModelCall, \\\"enter\\\",\\n    map[string]any{\\\"model\\\": req.Model}, time.Time{}, nil)\"},{\"name\":\"IM 渠道\",\"desc\":\"三种平台，统一 channel.Channel 接口。飞书：WebSocket + Schema 2.0 交互卡片（折叠面板、工具调用卡片、审批按钮、/mode），patch 流式。微信：ilinkai HTTP 长轮询，纯文本一次性回复（无卡片 API），CDN 媒体。企微：WebSocket + 原生流式（消息原地增长），template_card 审批。进程级守护；--channel 或 POST /connect 启动。\",\"chips\":[\"飞书\",\"微信\",\"企微\",\"流式\"],\"example\":\"./openagent serve --channel feishu\\n# 扫码 → 创建机器人，保存凭据\\n# 进程级：前端只触发/观察\\n# /clear /mode（飞书）slash 命令\"},{\"name\":\"Plan 模式\",\"desc\":\"三种会话模式之一（auto/manual/plan）。plan 模式下，执行工具（shell/write/terminal）被移除，只留只读工具 + plan_create/exit_plan_mode。agent 探索并分解，然后退出执行。plan_update（标记步骤状态）在所有模式可用。enter_plan_mode/exit_plan_mode 切换工具集。\",\"chips\":[\"只读\",\"plan_create\",\"exit_plan_mode\",\"跨模式\"],\"example\":\"// acp/server.go\\nenter_plan_mode → 注入 plan_create+exit\\nplan 模式: shell/write 移除, 只读保留\\nexit_plan_mode → 恢复先前模式\"},{\"name\":\"进程管理器\",\"desc\":\"跨轮次持久化的后台 shell 进程。每个进程一个目录（stdout.log/stderr.log/exit.code）；输出写磁盘（非 pipe），父进程退出也存活。model 跨轮次读 /proc-\u003cpid\u003e/stdout.log、检查 exit.code。每会话；会话结束 kill 全部。\",\"chips\":[\"跨轮次\",\"磁盘输出\",\"每会话\"],\"example\":\"// process/manager.go\\nCreate(cmd) → dir/\u003chex-id\u003e/\\nSetPID(pid) → 重命名为 proc-\u003cpid\u003e\\nmodel 读 proc-\u003cpid\u003e/stdout.log\"},{\"name\":\"沙箱\",\"desc\":\"OS 原生约束 shell/文件/网络。Linux：bubblewrap（bwrap）——新 mount namespace，系统路径只读，workspace 可写，--die-with-parent；PID namespace 特意不 unshare（让 model 能 kill 进程）。macOS：sandbox-exec + Seatbelt profile。Windows：未实现（unconfined + 警告）。网络隔离可选（--sandbox + network:isolated）。\",\"chips\":[\"bwrap\",\"seatbelt\",\"namespace\",\"fail-open\"],\"example\":\"./openagent serve --sandbox --port 8080\\n# bwrap: --ro-bind /usr, --bind /workspace\\n# --unshare-net（若 network=isolated）\\n# bwrap 缺失 → unconfined + 警告\"}]}]},\"plugin\":{\"title\":\"WASM 插件\",\"intro\":\"插件是 WASM 模块（.wasm）。任何能编译到 WASM 的语言都行——Rust、Go、TypeScript、Zig。宿主（wazero）在沙箱环境加载；Rust SDK（openagent-pdk）通过 Plugin trait + export! 宏封装 FFI 契约。ABI 足够简单，任何语言都能直接实现。\",\"typesTitle\":\"插件类型\",\"cronNote\":\"任何插件类型都能在 metadata 中声明 cron 定时任务——宿主向调度器注册，触发时调用 run_scheduled。见下方 cron 细节。\",\"cronTitle\":\"Cron 定时任务\",\"types\":[{\"name\":\"agent:tools\",\"exports\":\"execute(ptr,len)\",\"desc\":\"给智能体添加自定义工具——可像 shell/read/write 一样调用。工具名/描述/参数来自 metadata()。\",\"chips\":[\"agent侧\",\"execute\"]},{\"name\":\"agent:observers\",\"exports\":\"run(ptr,len)\",\"desc\":\"挂钩智能体 7-stage run 管道（每阶段 enter/leave）。返回 continue 或 abort。\",\"chips\":[\"agent侧\",\"stage-filter\"]},{\"name\":\"cli:settings\",\"exports\":\"init(ptr,len)\",\"desc\":\"启动时变换 settings.json——合并环境变量、添加 provider、注入配置。\",\"chips\":[\"cli侧\",\"启动\"]},{\"name\":\"cli:commands\",\"exports\":\"commands() + run_\u003cname\u003e\",\"desc\":\"向 CLI 注册额外 cobra 子命令。每个叶子命令一个 run_\u003cname\u003e 导出。\",\"chips\":[\"cli侧\",\"cobra\"]},{\"name\":\"cli:observers\",\"exports\":\"on_startup/on_shutdown/on_command_*\",\"desc\":\"监控 CLI 命令生命周期——启动、关闭、每命令 enter/exit。\",\"chips\":[\"cli侧\",\"生命周期\"]},{\"name\":\"cli:http\",\"exports\":\"handle_request(ptr,len)\",\"desc\":\"注册自定义 HTTP 路由，服于 /api/plugins/\u003cname\u003e/\u003cpath\u003e。输入 HttpRequest，返回 HttpResp。\",\"chips\":[\"cli侧\",\"路由\"]}],\"abiTitle\":\"ABI 契约\",\"abiDesc\":\"每个插件导出 alloc/dealloc/metadata（host↔guest 内存 + 类型发现所需）。每种类型再加自己的入口点导出。host↔guest 通信用 packed (ptr,len) u64——高 32 位是 WASM 内存指针，低 32 位是长度。\",\"abiExports\":\"# 所有类型必需\\nalloc(size: u32) -\u003e u32            # host→guest 内存\\ndealloc(ptr: u32)                  # 释放输入/输出缓冲\\nmetadata() -\u003e u64                  # packed PluginMeta JSON\\n\\n# 按类型入口点（packed JSON 进出）\\ninit(ptr, len) -\u003e u64              # cli:settings\\ncommands() -\u003e u64                  # cli:commands\\non_startup() / on_shutdown()       # cli:observers\\non_command_start(ptr, len)         # cli:observers\\non_command_end(ptr, len)           # cli:observers\\nexecute(ptr, len) -\u003e u64           # agent:tools\\nrun(ptr, len) -\u003e u64               # agent:observers\\nhandle_request(ptr, len) -\u003e u64    # cli:http\\nrun_scheduled(ptr, len) -\u003e u64     # 定时任务（任何类型）\",\"examplesTitle\":\"PDK 示例（Rust）\",\"examples\":[{\"title\":\"agent:tools — EchoPlugin\",\"desc\":\"智能体可调用的工具。plugin_type/name/description/parameters 来自 trait；execute 收到 args JSON。\",\"code\":\"#![no_std]\\n#![no_main]\\nextern crate alloc;\\nuse openagent_pdk::prelude::*;\\nuse openagent_pdk::export::Plugin;\\n\\nstruct EchoPlugin;\\nimpl Plugin for EchoPlugin {\\n    fn plugin_type() -\u003e \u0026'static str { \\\"agent:tools\\\" }\\n    fn name() -\u003e \u0026'static str { \\\"echo\\\" }\\n    fn description() -\u003e \u0026'static str { \\\"回显输入消息。\\\" }\\n    fn tool_parameters() -\u003e Option\u003c\u0026'static str\u003e {\\n        Some(r#\\\"{\\\"type\\\":\\\"object\\\",\\\"properties\\\":{\\\"message\\\":{\\\"type\\\":\\\"string\\\"}},\\\"required\\\":[\\\"message\\\"]}\\\"#)\\n    }\\n    fn execute(args: \u0026serde_json::Value) -\u003e Result\u003cString, String\u003e {\\n        let msg = args.get(\\\"message\\\").and_then(|v| v.as_str()).unwrap_or(\\\"(empty)\\\");\\n        Ok(format!(\\\"you said: {}\\\", msg))\\n    }\\n}\\nopenagent_pdk::export!(EchoPlugin);\"},{\"title\":\"agent:observers — LoggerPlugin\",\"desc\":\"挂钩每个阶段。stage_filter (\\\"*\\\",\\\"*\\\") 表示所有阶段、所有相位；observe_stage 返回 continue 或 abort。\",\"code\":\"#![no_std]\\n#![no_main]\\nextern crate alloc;\\nuse openagent_pdk::prelude::*;\\nuse openagent_pdk::export::Plugin;\\n\\nstruct LoggerPlugin;\\nimpl Plugin for LoggerPlugin {\\n    fn plugin_type() -\u003e \u0026'static str { \\\"agent:observers\\\" }\\n    fn name() -\u003e \u0026'static str { \\\"observer_logger\\\" }\\n    fn stage_filter() -\u003e (\u0026'static str, \u0026'static str) { (\\\"*\\\", \\\"*\\\") }\\n\\n    fn observe_stage(event: \u0026StageInput) -\u003e StageOutput {\\n        host::log_info(\u0026format!(\\\"stage={} phase={}\\\", event.name, event.phase));\\n        StageOutput { action: String::from(\\\"continue\\\"), reason: String::new() }\\n    }\\n}\\nopenagent_pdk::export!(LoggerPlugin);\"},{\"title\":\"定时任务 — EnvSyncPlugin\",\"desc\":\"在 metadata 声明 cron 任务；宿主注册并在触发时调用 run_scheduled_job。用 host::keyring_get + host::env_set。\",\"code\":\"#![no_std]\\n#![no_main]\\nextern crate alloc;\\nuse openagent_pdk::prelude::*;\\nuse openagent_pdk::export::Plugin;\\n\\nstruct EnvSyncPlugin;\\nimpl Plugin for EnvSyncPlugin {\\n    fn name() -\u003e \u0026'static str { \\\"envsync\\\" }\\n\\n    fn scheduled_jobs() -\u003e Vec\u003cScheduledJob\u003e {\\n        vec![ScheduledJob {\\n            id: \\\"sync-keyring-env\\\".into(),\\n            cron: \\\"*/5 * * * *\\\".into(),\\n            description: \\\"同步 keyring 密钥到环境变量\\\".into(),\\n        }]\\n    }\\n\\n    fn run_scheduled_job(job: \u0026ScheduledJobInput) -\u003e Result\u003cString, String\u003e {\\n        let secret = host::keyring_get(\\\"openagent\\\", \\\"PLUGIN_SECRET\\\")?;\\n        host::env_set(\\\"OPENAGENT_PLUGIN_SECRET\\\", \u0026secret)?;\\n        Ok(format!(\\\"job {} 同步 {} 字节\\\", job.id, secret.len()))\\n    }\\n}\\nopenagent_pdk::export!(EnvSyncPlugin);\"}],\"hostTitle\":\"Host 导出（28）\",\"hostDesc\":\"任何语言可导入。host 模块恰好导出 28 个函数；Rust PDK 声明同样的 28 个 FFI 导入——两侧一致。\",\"hostGroups\":[{\"category\":\"logging\",\"fns\":[{\"name\":\"log_info(msg)\",\"purpose\":\"经 host 日志\"},{\"name\":\"log_warn(msg)\",\"purpose\":\"经 host 警告\"},{\"name\":\"log_error(msg)\",\"purpose\":\"经 host 报错\"}]},{\"category\":\"time\",\"fns\":[{\"name\":\"utc_now() -\u003e u64\",\"purpose\":\"纳秒\"}]},{\"category\":\"keyring\",\"fns\":[{\"name\":\"keyring_get(svc, key)\",\"purpose\":\"读密钥\"},{\"name\":\"keyring_set(svc, key, val)\",\"purpose\":\"写密钥\"},{\"name\":\"keyring_delete(svc, key)\",\"purpose\":\"删密钥\"}]},{\"category\":\"http\",\"fns\":[{\"name\":\"http_request(method, url, hdrs, body)\",\"purpose\":\"出站 HTTP\"}]},{\"category\":\"process + env\",\"fns\":[{\"name\":\"exec_command(...)\",\"purpose\":\"子进程\"},{\"name\":\"env_get(key)\",\"purpose\":\"读环境变量\"},{\"name\":\"env_set(key, val)\",\"purpose\":\"设环境变量\"},{\"name\":\"env_unset(key)\",\"purpose\":\"删环境变量\"},{\"name\":\"env_list()\",\"purpose\":\"完整环境\"}]},{\"category\":\"filesystem\",\"fns\":[{\"name\":\"fs_read(path)\",\"purpose\":\"base64 读\"},{\"name\":\"fs_write(path, data)\",\"purpose\":\"写文件\"},{\"name\":\"fs_readdir(path)\",\"purpose\":\"列目录\"},{\"name\":\"file_md5(path)\",\"purpose\":\"文件 MD5\"},{\"name\":\"directory_md5(path)\",\"purpose\":\"目录聚合 MD5\"}]},{\"category\":\"runtime\",\"fns\":[{\"name\":\"runtime_session_id()\",\"purpose\":\"会话 ID\"},{\"name\":\"runtime_user_id()\",\"purpose\":\"用户 ID\"},{\"name\":\"runtime_turn_count()\",\"purpose\":\"轮次\"},{\"name\":\"runtime_model_id()\",\"purpose\":\"模型 ID\"},{\"name\":\"runtime_provider()\",\"purpose\":\"provider 名\"},{\"name\":\"runtime_get_metadata(k)\",\"purpose\":\"读 metadata\"},{\"name\":\"runtime_set_metadata(k, v)\",\"purpose\":\"写 metadata\"},{\"name\":\"runtime_setmodel_config(json)\",\"purpose\":\"替换模型\"},{\"name\":\"runtime_set_system_prompts(json)\",\"purpose\":\"覆盖提示词\"},{\"name\":\"runtime_set_max_turns(n)\",\"purpose\":\"覆盖最大轮次\"}]}],\"cronDetailTitle\":\"Cron 调度\",\"cronDetailDesc\":\"Vixie cron 语义：5 字段（分 时 日 月 周）。当 dom 和 dow 同时受限时，两者取或（13 号 OR 周五）。8 年搜索窗口，让 2/29 任务在非闰年也能存活。从不匹配的表达式在注册时被拒绝。秒级 ticker，30s 任务超时，panic 恢复，内存态（重启后从插件 metadata 重新注册）。\",\"cronDetailExample\":\"# 5 字段 Vixie cron\\n*/5 * * * *        每 5 分钟\\n0 9 * * 1-5       工作日 9 点\\n0 0 13 * 5        13 号 OR 周五（或逻辑）\\n0 0 29 2 *        2/29（8 年窗口找到下个闰年）\\n0 0 30 2 *        被拒绝——永不匹配\\n\\n# scheduler.go\\n- ticker：1 秒\\n- 任务超时：30s\\n- 无自并发（运行中的任务跳过）\\n- 错过的运行丢弃（不补跑）\\n- panic recover（插件崩溃 ≠ 宿主崩溃）\\n- 内存态：重
