/script><script>self.__next_f.push([1,"4:[\"$\",\"$L10\",null,{\"formats\":\"$undefined\",\"locale\":\"en\",\"messages\":{\"nav\":{\"docs\":\"Docs\",\"github\":\"GitHub\",\"changelog\":\"Changelog\"},\"localeSwitch\":{\"en\":\"EN\",\"zh\":\"中文\",\"label\":\"Switch language\"},\"landing\":{\"tagline\":\"A Pluggable Multi-Agent AI Framework in Go\",\"subtitle\":\"Every component is an interface — Model, Memory, Tools, Guards, Approver, Hooks, Observer — assembled by a 7-stage runtime. Three multi-agent modes (sub-agent delegation, transfer-to team, DAG orchestrate), ACP v1, layered governance, WASM plugins, and IM channels (Feishu / WeChat / WeCom). Agent is pure config; the runtime is the execution body.\",\"cta\":{\"github\":\"View on GitHub\",\"start\":\"Get Started\"},\"mentalModel\":\"Agent is pure configuration. kernel.Runtime is a 7-stage mainline loop wiring independent top-level packages via DI. Multi-agent comes in three shapes: SubAgent (sync as-tool delegation), Team (transfer_to_* control handoff), Orchestrate (LLM-planned DAG, parallel execution). IM channels are process-level daemons — the agent runs the same; the channel is just another transport.\",\"heroStack\":[\"Go 1.26\",\"ACP v1\",\"WASM\",\"wazero\"],\"terminal\":{\"title\":\"openagent — zsh\",\"lines\":[{\"type\":\"cmd\",\"text\":\"openagent serve --acp\"},{\"type\":\"ok\",\"text\":\"ACP v1 server ready on stdio (VSCode/Zed)\"},{\"type\":\"cmd\",\"text\":\"openagent run \\\"introduce yourself\\\"\"},{\"type\":\"out\",\"text\":\"→ I'm openagent-go, a pluggable multi-agent framework...\"},{\"type\":\"ok\",\"text\":\"done (1 turn, 312 tokens)\"},{\"type\":\"cmd\",\"text\":\"openagent serve --channel feishu\"},{\"type\":\"out\",\"text\":\"QR code → scan to provision bot\"},{\"type\":\"ok\",\"text\":\"feishu connected (WebSocket, card streaming)\"},{\"type\":\"comment\",\"text\":\"# also: --channel wechat (long-poll) / wecom (stream)\"}]},\"featuresTitle\":\"Highlights\",\"features\":{\"pluggable\":{\"title\":\"Pluggable interfaces\",\"desc\":\"Model, Memory, Tools, Guards, Approver, Hooks, Observer — every component is an interface injected via Deps. Agent holds only config; the runtime wires the rest.\"},\"multiagent\":{\"title\":\"Three multi-agent modes\",\"desc\":\"SubAgent (sync as-tool delegation), Team (transfer_to_* control handoff with loop detection), Orchestrate (LLM-planned DAG, parallel batches, auto-replan). Composable — an agent can be in a Team and a Plan step.\"},\"acp\":{\"title\":\"ACP v1 + IM channels\",\"desc\":\"ACP v1 over stdio (VSCode/Zed/opencode). Plus three IM transports: Feishu (WebSocket cards, streaming, approval buttons), WeChat (ilinkai long-poll, one-shot replies), WeCom (native streaming). Process-level daemons.\"},\"runtime\":{\"title\":\"7-stage runtime\",\"desc\":\"guard.in → memory.fetch → prompt.build → model.call → guard.out → tool.execute → memory.append. Each stage emits observe events; policy + execution live inside tool.execute.\"},\"governance\":{\"title\":\"Layered governance\",\"desc\":\"rules → safety → approval memory → human. First-match rules, read-only auto-allow, multi-key ALL-must-match memory, fail-closed human layer. Plan mode removes execution tools for safe exploration.\"},\"plugins\":{\"title\":\"WASM plugins + sandbox\",\"desc\":\"6 plugin types + cron-scheduled jobs, 28 host exports, wazero runtime, Rust PDK. OS-native sandbox (Linux bwrap / macOS Seatbelt) confines shell, file, and network.\"}},\"archTeaserTitle\":\"Architecture at a glance\",\"archTeaserDesc\":\"Agent is pure config; kernel.Runtime is a thin orchestrator running a 7-stage loop. The real subsystems — context, execution, governance, session, provider, eventbus — are independent top-level packages injected as interfaces, not kernel subdirectories.\",\"archReadMore\":\"Read full architecture →\",\"arch\":{\"app\":{\"title\":\"Application\",\"sub\":\"rest · acp · cmd/cli\",\"note\":\"assembles Agent config + Deps\"},\"new\":\"New(*agent.Agent, Deps)\",\"runtime\":{\"title\":\"kernel.Runtime\",\"sub\":\"7-stage mainline loop\",\"note\":\"thin orchestrator\"},\"loopLabel\":\"mainline loop (observer.go stages)\",\"stages\":[\"guard.in\",\"memory.fetch\",\"prompt.build\",\"model.call\",\"guard.out\",\"tool.execute\",\"memory.append\"],\"deps\":\"Deps DI — independent top-level packages\",\"pkg\":{\"context\":\"context/ — AgentContext + knowledge\",\"execution\":\"execution/ — tool jobs, retry, stream\",\"governance\":\"governance/ — rules→safety→memory→human\",\"session\":\"session/ — store + compression\",\"provider\":\"provider/ — skill | resource\",\"eventbus\":\"eventbus/ — audit events\"},\"pluggable\":\"all interface-injected\",\"iface\":{\"title\":\"Model · Tools · MCP\",\"sub\":\"pluggable\",\"note\":\"swapped per Agent config\"},\"transport\":\"ACP · REST · CLI · IM channels\",\"out\":{\"title\":\"Transports\",\"sub\":\"stdio · HTTP · WebSocket\",\"note\":\"ACP v1 / REST+SSE / Feishu / WeChat / WeCom\"},\"deliver\":\"execute · guard · approve → stream + persist\"},\"quickstartTitle\":\"Quick start\",\"prereq\":\"Prerequisites: Go 1.26+.\",\"buildTitle\":\"Build \u0026 run\",\"configTitle\":\"Configure\",\"firstRunTitle\":\"First run\",\"firstRun\":[\"Build the CLI: go build -o openagent ./cmd/cli/\",\"Create ~/.openagent/settings.json with a provider (api_key + models).\",\"Optionally place AGENTS.md (working rules) and SOUL.md (persona) in ~/.openagent/profile/.\",\"Run ./openagent serve --acp for an ACP client (VSCode/Zed), or --port 8080 for REST + SSE.\",\"Toggle capabilities: --guard on, --approver on, --sandbox for OS-level confinement.\",\"Drop .wasm files in ~/.openagent/plugins/ — they auto-load by type.\"]},\"docs\":{\"sidebarTitle\":\"openagent-go\",\"sidebarVersion\":\"docs\",\"groupOverview\":\"Overview\",\"groupReference\":\"Reference\",\"architecture\":\"Architecture\",\"concepts\":\"Core concepts\",\"plugins\":\"Plugins\",\"changelog\":\"Changelog\",\"arch\":{\"title\":\"Architecture\",\"intro\":\"Agent is pure configuration; kernel.Runtime is a thin orchestrator running a 7-stage mainline loop. The real subsystems are independent top-level packages wired through Deps — not kernel internals.\",\"layersTitle\":\"Layers\",\"layers\":[{\"title\":\"Agent is pure config\",\"desc\":\"agent.Agent holds only fields: SystemPrompts, Model, Prompt, InGuard, OutGuard, MaxTurns, MaxWorkingTokens, MaxCompressedTokens, SubAgents. No execution methods. New(*agent.Agent, Deps) separates config from runtime.\",\"chips\":[\"pure-config\",\"DI\",\"no-execution\"],\"example\":\"// agent/agent.go\\ntype Agent struct {\\n    SystemPrompts []string\\n    Model    openagent.Model      // interface\\n    Prompt   openagent.PromptBuilder\\n    InGuard  governance.InputGuard\\n    OutGuard governance.OutputGuard\\n    SubAgents []SubAgent\\n    // ...MaxTurns, token budgets\\n}\"},{\"title\":\"7-stage mainline loop\",\"desc\":\"observer.go declares 7 stage constants. run() emits observe events in this order; policy + execution are merged inside executeTools (no separate stage). memory.append fires after every committed message.\",\"chips\":[\"observe\",\"commit-per-msg\",\"7-stages\"],\"example\":\"// observer.go\\nStageGuardIn  = \\\"guard.in\\\"\\nStageMemoryFetch = \\\"memory.fetch\\\"\\nStagePromptBuild = \\\"prompt.build\\\"\\nStageModelCall   = \\\"model.call\\\"\\nStageGuardOut    = \\\"guard.out\\\"\\nStageToolExecute = \\\"tool.execute\\\"\\nStageMemoryAppend = \\\"memory.append\\\"\"},{\"title\":\"Deps-injected top-level packages\",\"desc\":\"context, execution, governance, session, provider, eventbus are independent packages, not kernel subdirectories. Runtime holds them as interface fields via Deps. kernel is a thin orchestrator, not an implementation.\",\"chips\":[\"interface-driven\",\"pluggable\",\"thin-orchestrator\"],\"example\":\"// kernel/runtime.go\\ntype Runtime struct {\\n    cfg  *agent.Agent\\n    deps Deps\\n    execution execution.Runtime   // injected\\n    context   ctxpkg.Runtime      // injected\\n    // SessionStore, Policy, HumanApprover, ...\\n}\"},{\"title\":\"Governance policy chain\",\"desc\":\"Engine.Evaluate is one inline method: rules (first-match glob) → safety (read-only tools auto-allow) → memory (multi-key ALL must match) → human (fail-closed). Shell commands decompose into atoms + file accesses; all must be remembered to skip approval.\",\"chips\":[\"layered\",\"fail-closed\",\"multi-key-ALL\"],\"example\":\"// governance/policy.go Evaluate()\\n1. rules    — first matching Rule wins (Allow/Deny/Ask)\\n2. safety   — read-only tools (read/ls/grep/...) → Allow\\n3. memory   — Recall; multi-key tools need ALL keys\\n4. human    — nil approver → Deny (fail closed)\"},{\"title\":\"Two-tier memory + knowledge\",\"desc\":\"Working memory: token-driven trim (70% of window or MaxWorkingTokens). Compressed: LLM incremental summary (8-section format), auto-triggered on overflow or via /compact. SessionStore messages are NEVER deleted. A separate MemoryProvider holds durable knowledge (preference/fact/lesson) with vector + keyword recall — self-evolution, not message archiving.\",\"chips\":[\"token-driven\",\"llm-summary\",\"never-deleted\",\"vector-recall\"],\"example\":\"// kernel/prepare.go — working trim\\nbudget := workingTokenBudget()  // 70% of window\\noverflow := scanTokensBottomUp(msgs)\\nreturn msgs[overflow:], ci, nil\\n\\n// ContextUsage() → (summary, working, window)  // two tiers\"},{\"title\":\"ToolResult disk spill\",\"desc\":\"DefaultResultPolicy: when a tool result's token count exceeds 5% of the model's context window, the content is written to /tmp/openagent/sess-\u003cid\u003e/artifact-\u003chex\u003e.txt (long lines wrapped at 32K runes). The in-context result is replaced with a pointer; FileRef + Truncated flags set.\",\"chips\":[\"5%-threshold\",\"disk-spill\",\"FileRef\"],\"example\":\"// result.go DefaultResultPolicy.Apply()\\nthreshold := cw * 5 / 100\\nif CountTokens(modelID, content) \u003e threshold {\\n    path := filepath.Join(ArtifactRoot(), \\\"sess-\\\"+id,\\n        \\\"artifact-\\\"+randHex(8)+\\\".txt\\\")\\n    // write wrapped content, set Truncated + FileRef\\n}\"}],\"stackTitle\":\"Tech stack\",\"stack\":[{\"layer\":\"Language\",\"stack\":\"Go 1.26\"},{\"layer\":\"Runtime\",\"stack\":\"kernel.Runtime — 7-stage mainline loop, Deps DI\"},{\"layer\":\"Protocol\",\"stack\":\"ACP v1 (JSON-RPC 2.0), MCP\"},{\"layer\":\"Plugins\",\"stack\":\"wazero WASM, Rust PDK (openagent-pdk)\"},{\"layer\":\"Storage\",\"stack\":\"SQLite + FTS5, file store\"},{\"layer\":\"Sandbox\",\"stack\":\"Linux bwrap, macOS Seatbelt\"},{\"layer\":\"Tokenizer\",\"stack\":\"tiktoken (model-aware, sampled for huge texts)\"},{\"layer\":\"Embeddings\",\"stack\":\"BGE (offline ONNX Runtime), OpenAI-compatible API\"}]},\"concept\":{\"title\":\"Core concepts\",\"intro\":\"The vocabulary of openagent-go — Agent is pure config; the runtime is the execution body; everything pluggable is an interface.\",\"groups\":[{\"group\":\"Configuration\",\"items\":[{\"name\":\"Agent\",\"desc\":\"Pure configuration: system prompts, model, guards, sub-agents, token budgets. No execution methods. Assembled into a Runtime via New(*agent.Agent, Deps).\",\"chips\":[\"pure-config\",\"no-execution\"],\"example\":\"agent := agent.New(\\n    agent.WithModel(model),\\n    agent.WithSystemPrompts(\\\"You are...\\\"),\\n    agent.WithSubAgents(...),\\n)\\nrt := kernel.New(agent, deps)\"},{\"name\":\"SubAgent\",\"desc\":\"A child agent registered as a plain tool (named after the agent, e.g. \\\"researcher\\\"). The parent delegates a sub-task via tool call; the child runs a full agent loop with isolated memory (no SessionStore), filtered tools, inherited guard, then returns its FinalOutput. Synchronous — the parent blocks until the child finishes. NOT transfer_to_*.\",\"chips\":[\"as-tool\",\"sync\",\"isolated-memory\"],\"example\":\"// kernel/as_tool.go\\n// sa.Name → tool name (e.g. \\\"researcher\\\")\\n// parent calls researcher(task) → blocks\\n// child: own system prompt, no SessionStore\\n// returns FinalOutput string\"},{\"name\":\"AGENTS.md / SOUL.md\",\"desc\":\"Static context profiles. AGENTS.md = working rules; SOUL.md = persona \u0026 limits. User-level (~/.openagent/profile/) + project-level ($(pwd)/) resolution; project overrides user.\",\"chips\":[\"static\",\"profile\",\"override\"],\"example\":\"~/.openagent/profile/AGENTS.md   # user rules\\n./AGENTS.md                      # project rules (wins)\"}]},{\"group\":\"Multi-agent\",\"items\":[{\"name\":\"SubAgent (as-tool)\",\"desc\":\"Single-agent delegation: a parent agent registers a child as a plain tool and calls it for a sub-task. The child runs a full agent loop with isolated memory (no SessionStore), filtered tools, inherited guard, then returns its output. Synchronous — parent blocks until child finishes. Tool name is the agent name, NOT transfer_to_*.\",\"chips\":[\"delegation\",\"sync\",\"isolated\"],\"example\":\"// kernel/as_tool.go + subagent.go\\n// parent calls researcher(task) → blocks\\n// child: own prompt, no SessionStore\\n// returns FinalOutput → tool result\"},{\"name\":\"Team (transfer_to_*)\",\"desc\":\"Control-transfer handoff: agents run one at a time in a sequential chain. When an agent calls transfer_to_X (EndTurn tool), control passes to agent X — the original agent's turn ends. Each agent has private memory (tool calls/results) + shared team memory. Loop detection: ping-pong (A-B-A-B) and frequency (≥3 visits). transfer_to_* is Team-exclusive — not SubAgent, not Orchestrate.\",\"chips\":[\"handoff\",\"EndTurn\",\"private+shared-memory\",\"loop-detect\"],\"example\":\"// agent/team.go\\n// handoffTool: transfer_to_\u003cname\u003e, EndTurn=true\\n// teamRunner: sequential chain, maxHandoffs=10\\n// REST: POST /api/team/... (rest/team.go)\"},{\"name\":\"Orchestrate (DAG)\",\"desc\":\"Plan-and-execute: an LLM Planner decomposes the goal into a DAG once, before execution. The Executor runs steps in topological order with parallel batches (errgroup, max 8). Runtime is deterministic — no LLM except auto-replan on failure (rebuilds the affected subtree) and step summarization. Each step has an isolated session; upstream results shared as summaries.\",\"chips\":[\"DAG\",\"parallel\",\"auto-replan\",\"deterministic-runtime\"],\"example\":\"// orchestrate/orchestrate.go + executor.go\\n// Planner.Plan() → PlanDef (DAG)\\n// executor: Kahn topo sort + errgroup batches\\n// REST: /generate(SSE) /execute /replan\"}]},{\"group\":\"Runtime\",\"items\":[{\"name\":\"Runtime\",\"desc\":\"The execution body. Runs the 7-stage loop, holds Deps-injected subsystems, manages tools/approver/memory per session. Created by kernel.New(agent, deps).\",\"chips\":[\"7-stage\",\"orchestrator\",\"Deps\"],\"example\":\"// kernel/runtime.go\\nrt := kernel.New(agent, deps)\\nrt.RunStream(ctx, session, ...)\"},{\"name\":\"AgentContext\",\"desc\":\"Assembled every turn 0 by context.Runtime.Build(): system prompts + recalled knowledge + working memory + compressed summary. Updated per-turn with new messages.\",\"chips\":[\"per-turn\",\"knowledge-recall\"],\"example\":\"// context/provider.go\\nac := rt.context.Build(session)\\n// system + skills + memory + working + summary\"},{\"name\":\"Session\",\"desc\":\"Three modes: auto (tools execute immediately), manual (each non-readonly tool asks approval), plan (plan_create/plan_update before execution). Per-session state in SessionStore.\",\"chips\":[\"auto\",\"manual\",\"plan\"],\"example\":\"./openagent serve --acp\\n# mode set via /mode or session/set_mode\\n# default_mode in settings.json\"}]},{\"group\":\"Governance\",\"items\":[{\"name\":\"Policy\",\"desc\":\"The layered engine: rules → safety → memory → human. rules = first-match glob; safety = read-only auto-allow; memory = multi-key ALL; human = fail-closed.\",\"chips\":[\"layered\",\"Evaluate\"],\"example\":\"// governance/policy.go\\nd, err := engine.Evaluate(ctx, call, def, session)\\n// Allow | Deny | Ask(→human)\"},{\"name\":\"ApprovalMemory\",\"desc\":\"Two implementations: SessionApprovalMemory (in-process) and PersistentApprovalMemory (store-backed, survives restarts). Remember/Recall keyed by tool + args; shell uses multi-key (atoms + files).\",\"chips\":[\"session\",\"persistent\",\"multi-key\"],\"example\":\"// governance/memory.go + persistent_memory.go\\ntype ApprovalMemory interface {\\n    Remember(ctx, sessionID, key, Decision) error\\n    Recall(ctx, sessionID, key) (Decision, bool)\\n}\"},{\"name\":\"Decision\",\"desc\":\"The policy verdict: Allow, Deny (with reason), or Ask (route to human). Carries ModifiedArgs so a human can approve with edited arguments.\",\"chips\":[\"Allow\",\"Deny\",\"Ask\",\"ModifiedArgs\"],\"example\":\"type Decision struct {\\n    Action       ApprovalAction  // allow|deny|ask\\n    Reason       string\\n    ModifiedArgs json.RawMessage\\n}\"}]},{\"group\":\"Memory \u0026 knowledge\",\"items\":[{\"name\":\"Working memory\",\"desc\":\"The recent message window, trimmed by token count. Budget = MaxWorkingTokens or 70% of the model's context window. Overflow trimmed from the bottom.\",\"chips\":[\"token-driven\",\"70%-window\"],\"example\":\"// kernel/prepare.go\\nbudget := workingTokenBudget()\\nreturn msgs[overflow:], ci, nil\"},{\"name\":\"Compressed memory\",\"desc\":\"LLM-generated incremental summary in 8 sections (Claude Code format). Auto-triggered when working set overflows, or manually via /compact. Bounded by MaxCompressedTokens.\",\"chips\":[\"llm-summary\",\"8-sections\",\"/compact\"],\"example\":\"// summarizer/llm.go\\nsummary, err := compressor.Summarize(ctx, msgs)\\n// injected into prompt as compressed section\"},{\"name\":\"MemoryProvider\",\"desc\":\"A separate durable knowledge layer — NOT message archiving. Stores preference/fact/lesson entries with vector + keyword recall. LLM extractor turns finished runs into knowledge (self-evolution). Pluggable: SQLite (vector) or OpenViking (remote).\",\"chips\":[\"preference\",\"fact\",\"lesson\",\"vector\",\"self-evolution\"],\"example\":\"// context/provider.go\\ntype MemoryProvider interface {\\n    Search(ctx, query) ([]Knowledge, error)\\n    Remember(ctx, Knowledge) error\\n}\\n// kinds: preference | fact | lesson\"}]},{\"group\":\"Extension\",\"items\":[{\"name\":\"WASM Plugin\",\"desc\":\"6 types: agent:tools, agent:observers (agent-side); cli:settings, cli:commands, cli:observers, cli:http (CLI-side). Any can declare cron-scheduled jobs. wazero runtime, Rust PDK, 28 host exports.\",\"chips\":[\"wasm\",\"6-types\",\"cron\",\"wazero\"],\"example\":\"// settings.json\\n{ \\\"plugins\\\": [\\\"~/.openagent/plugins\\\"] }\\n// scans *.wasm, loads by metadata type\"},{\"name\":\"MCP\",\"desc\":\"Model Context Protocol client — imports external tools (browser, IaC, etc.) into the agent's tool set. Each tool call renders as a normal tool result.\",\"chips\":[\"external-tools\",\"stdio/http\"],\"example\":\"// settings.json\\n\\\"mcp_servers\\\": {\\n  \\\"browser\\\": { \\\"command\\\": \\\"npx\\\",\\n    \\\"args\\\": [\\\"-y\\\",\\\"@anthropic/mcp-server-browser-tools\\\"] }\\n}\"},{\"name\":\"Hook / Observer\",\"desc\":\"RunHooks: start/end callbacks sharing opaque state (OTEL spans nest, slog logs duration). Observer: enter/leave for each of the 7 stages — can abort the run.\",\"chips\":[\"RunHooks\",\"Observer\",\"7-stages\"],\"example\":\"// observer.go\\nrt.observe(ctx, StageModelCall, \\\"enter\\\",\\n    map[string]any{\\\"model\\\": req.Model}, time.Time{}, nil)\"},{\"name\":\"IM channels\",\"desc\":\"Three platforms via one channel.Channel interface. Feishu: WebSocket + Schema 2.0 interactive cards (collapsible panels, tool-call cards, approval buttons, /mode), patch-based streaming. WeChat: ilinkai HTTP long-poll, plain-text one-shot replies (no card API), CDN media. WeCom: WebSocket + native streaming (message grows in place), template_card approvals. Process-level daemon; --channel flag or POST /connect starts it.\",\"chips\":[\"feishu\",\"wechat\",\"wecom\",\"streaming\"],\"example\":\"./openagent serve --channel feishu\\n# QR scan → bot provisioned, creds saved\\n# process-level: frontend only triggers/observes\\n# /clear /mode (feishu) slash commands\"},{\"name\":\"Plan mode\",\"desc\":\"One of three session modes (auto/manual/plan). In plan mode, execution tools (shell/write/terminal) are removed; only read-only tools + plan_create/exit_plan_mode remain. The agent explores and decomposes, then exits to execute. plan_update (mark step status) works in ALL modes. enter_plan_mode/exit_plan_mode switch the tool set.\",\"chips\":[\"read-only\",\"plan_create\",\"exit_plan_mode\",\"cross-mode\"],\"example\":\"// acp/server.go\\nenter_plan_mode → inject plan_create+exit\\nplan mode: shell/write removed, read-only kept\\nexit_plan_mode → restore previous mode\"},{\"name\":\"Process manager\",\"desc\":\"Background shell processes that persist across turns. Each gets a dir (stdout.log/stderr.log/exit.code); output writes to disk (not pipes) so it survives parent exit. The model reads /proc-\u003cpid\u003e/stdout.log and checks exit.code across turns. Per-session; cleanup kills all on session end.\",\"chips\":[\"cross-turn\",\"disk-output\",\"per-session\"],\"example\":\"// process/manager.go\\nCreate(cmd) → dir/\u003chex-id\u003e/\\nSetPID(pid) → rename to proc-\u003cpid\u003e\\nmodel reads proc-\u003cpid\u003e/stdout.log\"},{\"name\":\"Sandbox\",\"desc\":\"OS-native confinement for shell/file/network. Linux: bubblewrap (bwrap) — new mount namespace, system paths read-only, workspace writable, --die-with-parent; PID namespace intentionally NOT unshared (so the model can kill processes). macOS: sandbox-exec + Seatbelt profile. Windows: NYI (runs unconfined with warning). Network isolation optional (--sandbox + network:isolated).\",\"chips\":[\"bwrap\",\"seatbelt\",\"namespace\",\"fail-open\"],\"example\":\"./openagent serve --sandbox --port 8080\\n# bwrap: --ro-bind /usr, --bind /workspace\\n# --unshare-net (if network=isolated)\\n# bwrap missing → unconfined + warn\"}]}]},\"plugin\":{\"title\":\"WASM Plugins\",\"intro\":\"Plugins are WASM modules (.wasm). Any language that compiles to WASM works — Rust, Go, TypeScript, Zig. The host (wazero) loads them in a sandboxed environment; a Rust SDK (openagent-pdk) wraps the FFI contract via the Plugin trait + export! macro. The ABI is simple enough to implement from any language.\",\"typesTitle\":\"Plugin types\",\"cronNote\":\"Any plugin type can also declare cron-scheduled jobs in its metadata — the host registers them with the scheduler and calls run_scheduled when they fire. See the cron detail section below.\",\"cronTitle\":\"Cron-scheduled jobs\",\"types\":[{\"name\":\"agent:tools\",\"exports\":\"execute(ptr,len)\",\"desc\":\"Adds custom tools to the agent — callable like shell/read/write. Tool name/description/parameters come from metadata().\",\"chips\":[\"agent-side\",\"execute\"]},{\"name\":\"agent:observers\",\"exports\":\"run(ptr,len)\",\"desc\":\"Hooks the agent's 7-stage run pipeline (enter/leave per stage). Returns continue or abort.\",\"chips\":[\"agent-side\",\"stage-filter\"]},{\"name\":\"cli:settings\",\"exports\":\"init(ptr,len)\",\"desc\":\"Transforms settings.json at startup — merge env vars, add providers, inject config.\",\"chips\":[\"cli-side\",\"startup\"]},{\"name\":\"cli:commands\",\"exports\":\"commands() + run_\u003cname\u003e\",\"desc\":\"Registers extra cobra subcommands into the CLI. One run_\u003cname\u003e export per leaf command.\",\"chips\":[\"cli-side\",\"cobra\"]},{\"name\":\"cli:observers\",\"exports\":\"on_startup/on_shutdown/on_command_*\",\"desc\":\"Monitors CLI command lifecycle — startup, shutdown, per-command enter/exit.\",\"chips\":[\"cli-side\",\"lifecycle\"]},{\"name\":\"cli:http\",\"exports\":\"handle_request(ptr,len)\",\"desc\":\"Registers custom HTTP routes served at /api/plugins/\u003cname\u003e/\u003cpath\u003e. Input: HttpRequest, returns HttpResp.\",\"chips\":[\"cli-side\",\"routes\"]}],\"abiTitle\":\"ABI contract\",\"abiDesc\":\"Every plugin exports alloc/dealloc/metadata (required for host↔guest memory + type discovery). Each type adds its own entry-point export. Host↔guest communication uses packed (ptr,len) u64 — the high 32 bits are the WASM memory pointer, low 32 the length.\",\"abiExports\":\"# Required for all types\\nalloc(size: u32) -\u003e u32            # host→guest memory\\ndealloc(ptr: u32)                  # free input/output buffers\\nmetadata() -\u003e u64                  # packed PluginMeta JSON\\n\\n# Per-type entry points (packed JSON in/out)\\ninit(ptr, len) -\u003e u64              # cli:settings\\ncommands() -\u003e u64                  # cli:commands\\non_startup() / on_shutdown()       # cli:observers\\non_command_start(ptr, len)         # cli:observers\\non_command_end(ptr, len)           # cli:observers\\nexecute(ptr, len) -\u003e u64           # agent:tools\\nrun(ptr, len) -\u003e u64               # agent:observers\\nhandle_request(ptr, len) -\u003e u64    # cli:http\\nrun_scheduled(ptr, len) -\u003e u64     # scheduled jobs (any type)\",\"examplesTitle\":\"PDK examples (Rust)\",\"examples\":[{\"title\":\"agent:tools — EchoPlugin\",\"desc\":\"A tool the agent can call. plugin_type/name/description/parameters come from the trait; execute receives args JSON.\",\"code\":\"#![no_std]\\n#![no_main]\\nextern crate alloc;\\nuse openagent_pdk::prelude::*;\\nuse openagent_pdk::export::Plugin;\\n\\nstruct EchoPlugin;\\nimpl Plugin for EchoPlugin {\\n    fn plugin_type() -\u003e \u0026'static str { \\\"agent:tools\\\" }\\n    fn name() -\u003e \u0026'static str { \\\"echo\\\" }\\n    fn description() -\u003e \u0026'static str { \\\"Echo back the input.\\\" }\\n    fn tool_parameters() -\u003e Option\u003c\u0026'static str\u003e {\\n        Some(r#\\\"{\\\"type\\\":\\\"object\\\",\\\"properties\\\":{\\\"message\\\":{\\\"type\\\":\\\"string\\\"}},\\\"required\\\":[\\\"message\\\"]}\\\"#)\\n    }\\n    fn execute(args: \u0026serde_json::Value) -\u003e Result\u003cString, String\u003e {\\n        let msg = args.get(\\\"message\\\").and_then(|v| v.as_str()).unwrap_or(\\\"(empty)\\\");\\n        Ok(format!(\\\"you said: {}\\\", msg))\\n    }\\n}\\nopenagent_pdk::export!(EchoPlugin);\"},{\"title\":\"agent:observers — LoggerPlugin\",\"desc\":\"Hooks every stage. stage_filter (\\\"*\\\",\\\"*\\\") means all stages, all phases; observe_stage returns continue or abort.\",\"code\":\"#![no_std]\\n#![no_main]\\nextern crate alloc;\\nuse openagent_pdk::prelude::*;\\nuse openagent_pdk::export::Plugin;\\n\\nstruct LoggerPlugin;\\nimpl Plugin for LoggerPlugin {\\n    fn plugin_type() -\u003e \u0026'static str { \\\"agent:observers\\\" }\\n    fn name() -\u003e \u0026'static str { \\\"observer_logger\\\" }\\n    fn stage_filter() -\u003e (\u0026'static str, \u0026'static str) { (\\\"*\\\", \\\"*\\\") }\\n\\n    fn observe_stage(event: \u0026StageInput) -\u003e StageOutput {\\n        host::log_info(\u0026format!(\\\"stage={} phase={}\\\", event.name, event.phase));\\n        StageOutput { action: String::from(\\\"continue\\\"), reason: String::new() }\\n    }\\n}\\nopenagent_pdk::export!(LoggerPlugin);\"},{\"title\":\"scheduled job — EnvSyncPlugin\",\"desc\":\"Declares a cron job in metadata; the host registers it and calls run_scheduled_job when it fires. Uses host::keyring_get + host::env_set.\",\"code\":\"#![no_std]\\n#![no_main]\\nextern crate alloc;\\nuse openagent_pdk::prelude::*;\\nuse openagent_pdk::export::Plugin;\\n\\nstruct EnvSyncPlugin;\\nimpl Plugin for EnvSyncPlugin {\\n    fn name() -\u003e \u0026'static str { \\\"envsync\\\" }\\n\\n    fn scheduled_jobs() -\u003e Vec\u003cScheduledJob\u003e {\\n        vec![ScheduledJob {\\n            id: \\\"sync-keyring-env\\\".into(),\\n            cron: \\\"*/5 * * * *\\\".into(),\\n            description: \\\"sync keyring secret into env\\\".into(),\\n        }]\\n    }\\n\\n    fn run_scheduled_job(job: \u0026ScheduledJobInput) -\u003e Result\u003cString, String\u003e {\\n        let secret = host::keyring_get(\\\"openagent\\\", \\\"PLUGIN_SECRET\\\")?;\\n        host::env_set(\\\"OPENAGENT_PLUGIN_SECRET\\\", \u0026secret)?;\\n        Ok(format!(\\\"job {} synced {} bytes\\\", job.id, secret.len()))\\n    }\\n}\\nopenagent_pdk::export!(EnvSyncPlugin);\"}],\"hostTitle\":\"Host exports (28)\",\"hostDesc\":\"Importable from any language. The host module exports exactly 28 functions; the Rust PDK declares the same 28 as FFI imports — the two sides agree.\",\"hostGroups\":[{\"category\":\"logging\",\"fns\":[{\"name\":\"log_info(msg)\",\"purpose\":\"log through host\"},{\"name\":\"log_warn(msg)\",\"purpose\":\"warn through host\"},{\"name\":\"log_error(msg)\",\"purpose\":\"error through host\"}]},{\"category\":\"time\",\"fns\":[{\"name\":\"utc_now() -\u003e u64\",\"purpose\":\"nanoseconds\"}]},{\"category\":\"keyring\",\"fns\":[{\"name\":\"keyring_get(svc, key)\",\"purpose\":\"read secret\"},{\"name\":\"keyring_set(svc, key, val)\",\"purpose\":\"write secret\"},{\"name\":\"keyring_delete(svc, key)\",\"purpose\":\"delete secret\"}]},{\"category\":\"http\",\"fns\":[{\"name\":\"http_request(method, url, hdrs, body)\",\"purpose\":\"outbound HTTP\"}]},{\"category\":\"process + env\",\"fns\":[{\"name\":\"exec_command(...)\",\"purpose\":\"child process\"},{\"name\":\"env_get(key)\",\"purpose\":\"read env var\"},{\"name\":\"env_set(key, val)\",\"purpose\":\"set env var\"},{\"name\":\"env_unset(key)\",\"purpose\":\"unset env var\"},{\"name\":\"env_list()\",\"purpose\":\"full environment\"}]},{\"category\":\"filesystem\",\"fns\":[{\"name\":\"fs_read(path)\",\"purpose\":\"base64 read\"},{\"name\":\"fs_write(path, data)\",\"purpose\":\"write file\"},{\"name\":\"fs_readdir(path)\",\"purpose\":\"list directory\"},{\"name\":\"file_md5(path)\",\"purpose\":\"file MD5\"},{\"name\":\"directory_md5(path)\",\"purpose\":\"dir ag
